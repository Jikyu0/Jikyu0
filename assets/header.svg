<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="80" y1="32" x2="1100" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A12"/>
      <stop offset="0.52" stop-color="#111126"/>
      <stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <linearGradient id="accent" x1="335" y1="100" x2="865" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6A7FF"/>
      <stop offset="0.5" stop-color="#8D8CFF"/>
      <stop offset="1" stop-color="#69D8FF"/>
    </linearGradient>
    <linearGradient id="line" x1="215" y1="0" x2="985" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6A7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A7A5FF"/>
      <stop offset="1" stop-color="#69D8FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 90) rotate(42) scale(360 260)">
      <stop stop-color="#865DFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#865DFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1040 300) rotate(-142) scale(380 270)">
      <stop stop-color="#42C8FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#42C8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-80" y="-80" width="1360" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="textGlow" x="100" y="55" width="1000" height="190" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="18" result="blurred"/>
      <feBlend in="SourceGraphic" in2="blurred" mode="normal"/>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowPurple)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowBlue)"/>

  <g filter="url(#blur)" opacity="0.7">
    <ellipse cx="208" cy="105" rx="120" ry="74" fill="#7C4DFF" fill-opacity="0.15"/>
    <ellipse cx="1030" cy="282" rx="140" ry="82" fill="#37C5FF" fill-opacity="0.13"/>
  </g>

  <g opacity="0.9">
    <circle cx="70" cy="66" r="4" fill="#C6A7FF"/>
    <circle cx="89" cy="66" r="4" fill="#8D8CFF"/>
    <circle cx="108" cy="66" r="4" fill="#69D8FF"/>
    <path d="M70 294H170" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <path d="M1030 66H1130" stroke="#FFFFFF" stroke-opacity="0.18"/>
  </g>

  <g opacity="0.3" stroke="url(#accent)" stroke-width="1.5">
    <path d="M102 154L68 180L102 206"/>
    <path d="M1098 154L1132 180L1098 206"/>
    <path d="M162 142L145 218"/>
    <path d="M1038 142L1055 218"/>
  </g>

  <text x="600" y="112" fill="#B9B8C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="5" text-anchor="middle">HELLO, I'M</text>

  <g filter="url(#textGlow)">
    <text x="600" y="183" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="1" text-anchor="middle">JULIANA MEJÍA</text>
  </g>

  <rect x="396" y="216" width="408" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.11"/>
  <circle cx="424" cy="238" r="5" fill="#87E7B6"/>
  <text x="446" y="244" fill="#F3F1FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">Frontend Developer</text>
  <text x="605" y="244" fill="#77758D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">·</text>
  <text x="624" y="244" fill="#F3F1FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500">UI/UX Designer</text>

  <rect x="215" y="294" width="770" height="1" fill="url(#line)"/>
  <text x="600" y="326" fill="#8E8CA1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="2.4" text-anchor="middle">DESIGNING INTERFACES · BUILDING EXPERIENCES</text>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27.25" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1.5"/>
</svg>
